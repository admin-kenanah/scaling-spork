<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>نموذج الديوان</title>

  <style>
    /* إعدادات عامة */
    :root{
      /* عرض موحّد للهيدر والفورم — عدّلها عند اللزوم (720/740/780) */
      --container-width: 760px;
      --radius: 12px;
      --shadow: 0 8px 24px rgba(0,0,0,.08);
      --page-bg: #f5f7fb;
    }
    *{ box-sizing: border-box; }
    body{
      margin:0;
      background: var(--page-bg);
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      color:#0f172a;
      line-height:1.6;
    }

    /* الحاوية الموحّدة للهيدر + النموذج (نفس العرض) */
    .container{
      width:100%;
      max-width: var(--container-width);
      margin:0 auto;
      padding:16px 12px; /* تقليل هوامش جانبية لزيادة عرض الفورم */
    }

    /* الهيدر */
    .header{ margin:0 0 16px 0; }
    .header img{
      width:100%;
      height:auto;
      display:block;
      border-radius: var(--radius);
    }

    /* بطاقة تحتوي النموذج */
    .card{
      background:#fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding:0;          /* نخلي الفورم من الحافة للحافة */
      border:0;
      overflow:hidden;    /* لقص زوايا الـiframe مع نفس الانحناء */
    }

    /* النموذج المضمّن — ارفع/خفض الارتفاع لتقليل السكروول */
    .iframe{
      display:block;
      width:100%;
      height:2050px;      /* جرّب 1950/2000/2150 حسب طول نموذجك */
      border:0;
    }

    /* ضبط للموبايل */
    @media (max-width: 768px){
      .container{ max-width:100%; padding:12px 8px; }
      .iframe{ height:2200px; } /* نرفع قليلًا على الشاشات الصغيرة */
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- الهيدر (نفس عرض النموذج) -->
    <div class="header">
      header1.jpg
    </div>

    <!-- النموذج (نفس عرض الهيدر) -->
    <div class="card">
      https://forms.office.com/Pages/ResponsePage.aspx?id=74DPoTo7akGXBALjKbXILpUvXxpvwExMmUTB_IeL7rNURUNZMDVSVkJVNDkzSFRCMkk3REtMNzVKMiQlQCN0PWcu&embed=true</iframe>
    </div>

  </div>

</body>
</html>
