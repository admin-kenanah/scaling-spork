<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>نظام الوارد</title>
  <style>
/* حاوية موحّدة للهيدر والفورم */
.container {
  width: 100%;
  max-width: 760px;   /* عدّلها لـ 700 أو 780 حسب ما تحب */
  margin: 0 auto;     /* توسيط الحاوية */
}

/* الهيدر */
.header {
  margin: 0 auto 16px;     /* توسيط + مسافة أسفل */
}
.header img {
  width: 100%;             /* يمتلئ عرض الحاوية */
  height: auto;
  display: block;
  border-radius: 12px;     /* اختياري للتناسق مع البطاقة */
}

/* البطاقة التي تحتوي الـ iframe */
.card {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,.08);
  padding: 0;              /* نخلي الفورم من الحافة للحافة */
  border: 0;
}

/* الإطار المضمَّن للنموذج */
.iframe {
  display: block;
  width: 100%;             /* يمتلئ عرض الحاوية */
  height: 1500px;          /* عدّلها حسب طول نموذجك */
  border: 0;
  border-radius: 12px;     /* يطابق حواف البطاقة */
}

/* استجابة للموبايل */
@media (max-width: 768px) {
  .iframe { height: 1700px; }
}  </style>
</head>
<body>
  <div class="header">
    <img src="header1.jpg" alt="Header" />
  </div>
  <div class="wrap">
    <div class="card">
      <iframe class="iframe" src="https://forms.office.com/Pages/ResponsePage.aspx?id=74DPoTo7akGXBALjKbXILpUvXxpvwExMmUTB_IeL7rNURUNZMDVSVkJVNDkzSFRCMkk3REtMNzVKMiQlQCN0PWcu" allowfullscreen></iframe>
    </div>
  </div>
</body>
</html>
