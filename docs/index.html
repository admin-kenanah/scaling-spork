<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>نموذج الديوان</title>

  <style>
    :root{
      /* عرض موحّد للهيدر والفورم — غيّرها إذا حبيت (720/740/780) */
      --container-width: 760px;
      --radius: 12px;
      --shadow: 0 8px 24px rgba(0,0,0,.08);
      --page-bg: #f5f7fb;

      /* ارتفاع النموذج داخل الإطار */
      --form-height-desktop: 2600px; /* جرّب 1950/2000/2050 بحسب طول نموذجك */
      --form-height-mobile: 2200px;  /* للموبايل */
      /* ارتفاع الغطاء الذي يغطي التذييل داخل الإطار */
      --footer-cover: 10px; /* زِده/قلّله حتى يختفي التذييل بالكامل */
    }

    *{ box-sizing: border-box; }
    body{
      margin:0;
      background: var(--page-bg);
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      color:#0f172a;
      line-height:1.6;
    }

    /* الحاوية الموحّدة للهيدر + النموذج (نفس العرض) */
    .container{
      width:100%;
      max-width: var(--container-width);
      margin:0 auto;
      padding:16px 12px;
    }

    /* الهيدر */
    .header{ margin:0 0 16px 0; }
    .header img{
      width:100%;
      height:auto;
      display:block;
      border-radius: var(--radius);
    }

    /* بطاقة تحتوي النموذج */
    .card{
      position: relative;  /* ضرورية للـ overlay */
      background:#fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding:0;
      border:0;
      overflow:hidden;     /* لقص زوايا الـiframe مع نفس الانحناء */
    }

    /* النموذج المضمّن — اضبط الارتفاع لتقليل السكروول */
    .iframe{
      display:block;
      width:100%;
      height: var(--form-height-desktop);
      border:0;
    }

    /*
      غطاء (Overlay) في أسفل البطاقة يغطي تذييل Microsoft Forms
      هذا لا يغيّر محتوى الـ iframe، فقط يخفيه بصريًا.
    */
    .card::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      height: var(--footer-cover);
      /* خلفية مطابقة لبطاقة النموذج (أبيض) مع تدرّج بسيط للأناقة */
      background:
        linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,.85) 35%, #ffffff 100%);
      pointer-events:none; /* لا يعطّل الضغط على زر الإرسال إن ظهر فوقه */
    }

    /* ضبط للموبايل */
    @media (max-width: 768px){
      .container{ max-width:100%; padding:12px 8px; }
      .iframe{ height: var(--form-height-mobile); }
      .card::after{ height: calc(var(--footer-cover) + 10px); }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- الهيدر (نفس عرض النموذج) -->
    <div class="header">
      <img src="header1.jpg" alt="header" />
    </div>

    <!-- النموذج (نفس عرض الهيدر) -->
    <div class="card">
      <iframe
        class="iframe"
        src="https://forms.office.com/Pages/ResponsePage.aspx?id=74DPoTo7akGXBALjKbXILpUvXxpvwExMmUTB_IeL7rNURUNZMDVSVkJVNDkzSFRCMkk3REtMNzVKMiQlQCN0PWcu&embed=true"
        allowfullscreen
      ></iframe>
    </div>

  </div>

</body>
</html>
