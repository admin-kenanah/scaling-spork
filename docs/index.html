<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>نظام الوارد</title>
  <style>
    /* اجعل الهيدر والفورم بنفس الحاوية والعرض */
.header,
.wrap {
    width: 100%;
    max-width: 1400px;   /* نفس القيمة الحالية للهيدر */
    margin: 0 auto;
}

/* خلي البطاقة بدون حشوة (padding) عشان الـiframe يكون من الحافة للحافة) */
.card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,.08);
    padding: 0;          /* كان 16px: أزلناه */
    border: 0;
}

/* تأكد أن الـiframe يغطي العرض تمامًا ومابينقصه البوردر */
.iframe {
    display: block;
    width: 100%;
    height: 1200px;      /* عدّلها كما تريد */
    border: 0;           /* مهم لعدم ظهور إطار المتصفح */
    border-radius: 12px; /* يطابق حواف البطاقة لو تحب */
}

/* مرونة للموبايل */
@media (max-width: 768px) {
  .iframe { height: 1500px; }
}

  </style>
</head>
<body>
  <div class="header">
    <img src="header1.jpg" alt="Header" />
  </div>
  <div class="wrap">
    <div class="card">
      <iframe class="iframe" src="https://forms.office.com/Pages/ResponsePage.aspx?id=74DPoTo7akGXBALjKbXILpUvXxpvwExMmUTB_IeL7rNURUNZMDVSVkJVNDkzSFRCMkk3REtMNzVKMiQlQCN0PWcu" allowfullscreen></iframe>
    </div>
  </div>
</body>
</html>
