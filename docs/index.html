<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>نظام الوارد</title>
  <style>
.header,
.wrap {
    width: 100%;
    max-width: none;   /* أو احذف max-width كليًا */
    margin: 0;         /* لا مركزية */
}

.card {
    padding: 0;
    border-radius: 0;         /* لإلغاء الزوايا إذا بدك full-bleed حقيقي */
    box-shadow: none;         /* عادةً بالـfull-bleed نلغي الظل */
}

.iframe {
    width: 100%;
    height: 1200px;
    border: 0;
    border-radius: 0;
}  </style>
</head>
<body>
  <div class="header">
    <img src="header1.jpg" alt="Header" />
  </div>
  <div class="wrap">
    <div class="card">
      <iframe class="iframe" src="https://forms.office.com/Pages/ResponsePage.aspx?id=74DPoTo7akGXBALjKbXILpUvXxpvwExMmUTB_IeL7rNURUNZMDVSVkJVNDkzSFRCMkk3REtMNzVKMiQlQCN0PWcu" allowfullscreen></iframe>
    </div>
  </div>
</body>
</html>
